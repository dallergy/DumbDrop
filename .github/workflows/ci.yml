name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=moderate

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          load: true
          tags: dumbdrop:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Production refuses to boot without a PIN (see ALLOW_INSECURE_NO_PIN).
      - name: Refuses to start without a PIN
        run: |
          set +e
          timeout 30 docker run --rm dumbdrop:ci
          status=$?
          set -e
          if [ "$status" -eq 0 ] || [ "$status" -eq 124 ]; then
            echo "Container did not refuse to start without DUMBDROP_PIN (exit $status)"
            exit 1
          fi

      - name: Smoke test
        run: |
          docker run -d --name dumbdrop -p 3000:3000 -e DUMBDROP_PIN=246810 dumbdrop:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:3000/health && exit 0
            sleep 1
          done
          docker logs dumbdrop
          exit 1

      - name: Scan image for vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.1 image --scanners vuln --ignore-unfixed \
            --severity HIGH,CRITICAL --exit-code 1 dumbdrop:ci
