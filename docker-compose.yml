services:
    dumbdrop:
        image: YOUR_DOCKERHUB_USER/dumbdrop:latest
        container_name: dumbdrop
        restart: unless-stopped
        ports:
            - 3000:3000
        volumes:
            - ./local_uploads:/app/uploads
        environment:
            UPLOAD_DIR: /app/uploads
            NODE_ENV: production
            PORT: 3000
            DUMBDROP_TITLE: DumbDrop
            MAX_FILE_SIZE: 1024
            DUMBDROP_PIN: 123456
            AUTO_UPLOAD: "true"
            SHOW_FILE_LIST: "true"
            BASE_URL: http://localhost:3000

            # Comma-separated list of allowed origins for CORS
            # ALLOWED_ORIGINS: http://internalip:port,https://subdomain.example.com

            # Reverse Proxy / Security Settings (IMPORTANT: Read documentation before enabling)
            # TRUST_PROXY: "true"
            # TRUSTED_PROXY_IPS: 172.17.0.1,10.0.0.1
