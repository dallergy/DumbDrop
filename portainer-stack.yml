# DumbDrop — Portainer stack (image-based, copy/paste ready)
#
# 1. Publish your image first (see README "Publish your Docker image")
# 2. Replace YOUR_DOCKERHUB_USER below with your Docker Hub username
# 3. Portainer → Stacks → Web editor → paste this file
# 4. Set BASE_URL to your public URL
# 5. Deploy / Update stack

services:
  dumbdrop:
    image: YOUR_DOCKERHUB_USER/dumbdrop:latest
    container_name: dumbdrop
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - dumbdrop_uploads:/app/uploads
    # Do not set user:. The image chowns this volume, then drops to node.
    environment:
      UPLOAD_DIR: /app/uploads
      NODE_ENV: production
      PORT: 3000
      BASE_URL: https://dumbdrop.example.com
      DUMBDROP_TITLE: DumbDrop Plus
      DUMBDROP_PIN: ""
      MAX_FILE_SIZE: 1024
      AUTO_UPLOAD: "true"
      SHOW_FILE_LIST: "true"
      TRUST_PROXY: "false"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  dumbdrop_uploads:
