<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{SITE_TITLE}} — Login</title>
    <meta name="color-scheme" content="light dark" />
    <script src="js/theme-init.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
    <script type="application/json" id="app-config">
      {{APP_CONFIG}}
    </script>
    <script type="module" src="js/login.js"></script>
  </head>
  <body class="auth-page">
    <div class="backdrop" aria-hidden="true"></div>
    <main class="auth-shell">
      <span class="brand-mark" aria-hidden="true">
        <svg
          class="icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 3v12" />
          <path d="m17 8-5-5-5 5" />
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        </svg>
      </span>
      <p class="kicker">{{SITE_TITLE}}</p>
      <h1 class="hero-title">Unlock the drop.</h1>
      <p class="muted">Enter your PIN to continue. Length is never shown.</p>
      <form id="pin-form" class="pin-form">
        <input
          id="pin-input"
          class="input pin-input"
          type="password"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="10"
          placeholder="PIN"
          required
        />
        <button class="btn btn-primary" type="submit">Continue</button>
      </form>
      <p id="pin-error" class="error-message" role="alert"></p>
    </main>
  </body>
</html>
