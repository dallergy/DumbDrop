<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in · {{SITE_TITLE}}</title>
    <meta name="color-scheme" content="light dark" />
    <script src="js/theme-init.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
    <script type="application/json" id="app-config">
      {{APP_CONFIG}}
    </script>
    <script type="module" src="js/login.js"></script>
  </head>
  <body>
    <main class="center-shell">
      <section class="card auth-card">
        <img class="brand-mark brand-mark-lg" src="assets/icon.svg" alt="" width="44" height="44" />
        <h1 class="auth-title">{{SITE_TITLE}}</h1>
        <p class="muted small">Enter your PIN to continue.</p>
        <form id="pin-form" class="auth-form">
          <input
            id="pin-input"
            class="input input-lg pin-input"
            type="password"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="10"
            placeholder="PIN"
            aria-label="PIN"
            required
          />
          <button class="btn btn-primary btn-block btn-lg" type="submit">Continue</button>
        </form>
        <p id="pin-error" class="error-message" role="alert"></p>
      </section>
    </main>
  </body>
</html>
