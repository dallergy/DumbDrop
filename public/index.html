<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{SITE_TITLE}} — Drop. Share. Done.</title>
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="toastify/toastify.css">
    <script src="toastify/toastify.js" defer></script>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
    <script type="application/json" id="app-config">{{APP_CONFIG}}</script>
    <script type="module" src="js/app.js"></script>
</head>
<body>
    <div id="dropOverlay" class="drop-overlay" hidden>
        <div class="drop-overlay-card">Drop files to add them</div>
    </div>

    <div class="app-shell">
        <header class="app-header">
            <div class="brand-lockup">
                <div class="brand-row">
                    <span class="brand-badge">Plus</span>
                    <h1>{{SITE_TITLE}}</h1>
                </div>
                <p class="brand-tagline">Drop files. Share links. Paste from clipboard.</p>
            </div>
            <div class="header-actions">
                <button id="themeToggle" class="btn btn-ghost btn-icon" type="button" aria-label="Toggle theme">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
                    </svg>
                </button>
                <button id="logoutBtn" class="btn btn-outline btn-sm" type="button" hidden>Log out</button>
            </div>
        </header>

        <section class="upload-container" id="dropZone">
            <div class="upload-content">
                <div class="upload-icon" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3v12"/>
                        <path d="m17 8-5-5-5 5"/>
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    </svg>
                </div>
                <p>Drag files here, paste from clipboard, or browse</p>
                <input type="file" id="fileInput" multiple hidden>
                <input type="file" id="folderInput" webkitdirectory directory multiple hidden>
                <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
                <div class="button-group">
                    <button id="browseFilesBtn" class="btn btn-primary" type="button">Browse files</button>
                    <button id="browseFoldersBtn" class="btn btn-outline" type="button">Browse folders</button>
                    <button id="cameraBtn" class="btn btn-outline" type="button">Camera</button>
                </div>
            </div>
        </section>

        <div id="fileList" class="queue-list"></div>
        <button id="uploadButton" class="btn btn-primary upload-button" type="button" hidden>Upload files</button>
        <div id="uploadProgress" class="progress-stack"></div>

        <section id="libraryPanel" class="library-panel" hidden>
            <div class="library-tabs" role="tablist">
                <button id="filesTab" class="library-tab active" type="button" role="tab" aria-selected="true">Files</button>
                <button id="sharesTab" class="library-tab" type="button" role="tab" aria-selected="false">Share links</button>
            </div>

            <div id="uploadedFilesList" class="library-pane active">
                <div class="library-header">
                    <div>
                        <h2>Your files</h2>
                        <p class="library-stats"><span id="totalFiles">0 files</span> · <span id="totalSize">0 B</span></p>
                    </div>
                    <div class="library-tools">
                        <input id="fileSearch" class="input" type="search" placeholder="Search files…" aria-label="Search files">
                        <button id="refreshFilesBtn" class="btn btn-outline btn-sm" type="button">Refresh</button>
                    </div>
                </div>
                <div id="uploadedFilesContent" class="library-body">
                    <div class="empty-state">Loading files…</div>
                </div>
            </div>

            <div id="shareLinksSection" class="library-pane">
                <div class="library-header">
                    <div>
                        <h2>Share links</h2>
                        <p class="library-stats"><span id="totalShares">0 links</span></p>
                    </div>
                    <button id="refreshSharesBtn" class="btn btn-outline btn-sm" type="button">Refresh</button>
                </div>
                <div id="shareLinksContent" class="library-body">
                    <div class="empty-state">Loading share links…</div>
                </div>
            </div>
        </section>
    </div>

    <div id="renameModal" class="dialog-backdrop" role="dialog" aria-modal="true" aria-labelledby="renameTitle">
        <div class="dialog">
            <h3 id="renameTitle">Rename item</h3>
            <input type="text" id="renameInput" class="input" placeholder="Enter new name…">
            <div class="dialog-actions">
                <button id="cancelRenameBtn" class="btn btn-ghost" type="button">Cancel</button>
                <button id="confirmRenameBtn" class="btn btn-primary" type="button">Rename</button>
            </div>
        </div>
    </div>

    <div id="shareModal" class="dialog-backdrop" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
        <div class="dialog">
            <h3 id="shareTitle">Create a share link</h3>
            <p class="muted" id="shareItemName"></p>

            <div id="shareForm" class="share-form">
                <label class="share-option">
                    <span>Require PIN to open</span>
                    <input type="checkbox" id="shareAuth">
                </label>
                <label class="share-option">
                    <span>Link expires</span>
                    <select id="shareExpiry" class="input">
                        <option value="0">Never</option>
                        <option value="3600">1 hour</option>
                        <option value="86400">1 day</option>
                        <option value="604800">7 days</option>
                        <option value="2592000">30 days</option>
                    </select>
                </label>
            </div>

            <div id="shareResult" class="share-result" hidden>
                <div class="share-qr-wrap">
                    <img id="shareQrImage" class="share-qr-image" alt="QR code for shared link">
                </div>
                <p class="muted">Scan the code or copy the link</p>
                <input id="shareLink" class="input" readonly>
                <div class="dialog-actions">
                    <button id="copyShareBtn" class="btn btn-primary" type="button" hidden>Copy link</button>
                    <button id="downloadQrBtn" class="btn btn-outline" type="button" hidden>Download QR</button>
                </div>
            </div>

            <div class="dialog-actions">
                <button id="closeShareBtn" class="btn btn-ghost" type="button">Close</button>
                <button id="createShareBtn" class="btn btn-primary" type="button">Create link</button>
            </div>
        </div>
    </div>
</body>
</html>
